<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Top Secret</title>

<meta name="description" content="Une petite blague.">
<meta name="keywords" content="top secret, blague, joire tony26">

<style>
body{
    margin:0;
    background:#000;
    color:#00ff00;
    font-family:Consolas, monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:700px;
    max-width:90%;
    background:#111;
    border:2px solid #00ff00;
    border-radius:15px;
    padding:30px;
    box-shadow:0 0 20px #00ff00;
}

h1{
    text-align:center;
    color:red;
    font-size:40px;
}

#texte{
    white-space:pre-line;
    font-size:22px;
    line-height:1.7;
}
</style>
</head>

<body>

<div class="box">
<h1>⚠️ TOP SECRET ⚠️</h1>

<div id="texte">
Analyse en cours Téléphone détecté...
</div>


<script>

const texte = document.getElementById("texte");

const messages = [

"📱 Téléphone détecté...",
"📸 Photos détectées...",
"🎵 Musique détectée...",
"📂 Fichiers analysés...",
"🍕 Niveau de gourmandise : 100 %",
"",
"😈 Tu as peut-être cru que j'avais piraté ton téléphone...",
"",
"😂 Eh non !",
"",
"C'était juste une blague !",
"",
"🎉 Tu viens de perdre quelques secondes de ta vie.",
"",
"😎 Bien joué, tu t'es fait avoir !"

];

let i = 0;

function afficher(){

if(i < messages.length){

texte.innerHTML += "\n" + messages[i];

i++;

setTimeout(afficher,900);

}

}
